name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit, API and eval regression tests
        # evals replay recorded Gemini responses on a frozen gold snapshot: no API key, no randomness
        run: pytest -q
      - name: Eval report
        if: always()
        run: python -m evals.run_evals --llm replay | tail -16

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t batchguard:ci .
      - name: Smoke test the API inside the container
        run: |
          docker run -d --name bg -p 8000:8000 batchguard:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/investigate -H 'content-type: application/json' -d '{"batch_id": 92}' > out.json
          python3 -c "import json; r = json.load(open('out.json')); assert r['status'] == 'PENDING_APPROVAL' and r['summary']['probable_cause_equipment_id'] == 'PH-102', r; print('container smoke test passed:', r['status'], r['summary']['probable_cause_equipment_id'])"
      - name: Container logs
        if: always()
        run: docker logs bg | tail -20

  publish:
    # continuous delivery: only on main, only after tests and the container smoke test pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yashaswi35/batchguard:latest
            ghcr.io/yashaswi35/batchguard:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Yashaswi35/batchguard
            org.opencontainers.image.description=BatchGuard governed deviation-investigation agent API
