[project]
name = "batchguard"
version = "0.1.0"
description = "Governed deviation-investigation agent for biomanufacturing"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]
